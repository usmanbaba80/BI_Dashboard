# Dagster behind Authelia login. Copy to /etc/nginx/sites-available/ and symlink.
# Run certbot for dagster.invicttusx.com to populate the ssl_certificate paths.

server {
    listen 80;
    server_name dagster.invicttusx.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dagster.invicttusx.com;

    ssl_certificate     /etc/letsencrypt/live/dagster.invicttusx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dagster.invicttusx.com/privkey.pem;

    # Authelia authz endpoint (internal).
    include /etc/nginx/snippets/authelia-location.conf;

    location / {
        # Require Authelia login before reaching Dagster.
        include /etc/nginx/snippets/authelia-authrequest.conf;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Dagster uses websockets for live run logs.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
