# Authelia login portal. Copy to /etc/nginx/sites-available/ and symlink.
# Run certbot for auth.invicttusx.com to populate the ssl_certificate paths.

server {
    listen 80;
    server_name auth.invicttusx.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name auth.invicttusx.com;

    ssl_certificate     /etc/letsencrypt/live/auth.invicttusx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.invicttusx.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:9091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
