version: 2

# 1) Run Airbyte sync -> tables appear in schema raw
# 2) List them:  psql ... -c "\dt raw.*"
# 3) Set `name` to the raw Postgres table (same in silver/stg_*.sql source('raw', '...')).
# 4) With abctl public API (AIRBYTE_CLIENT_ID/SECRET), Dagster asset is:
#    airbyte / <AIRBYTE_CONNECTION_NAME> / sync
#    Legacy dagster-airbyte: copy per-stream asset key from Dagster UI into meta.dagster.asset_key.
#
sources:
  - name: raw
    description: Bronze tables created by Airbyte
    schema: raw
    tables:
      - name: test
        description: Must match \dt raw.* on the warehouse
        meta:
          dagster:
            asset_key:
              - airbyte
              - BlinkAI_API → datawarehouse
              - test
