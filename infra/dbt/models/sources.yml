version: 2

# 1) Run Airbyte sync -> tables appear in schema raw
# 2) List them:  psql ... -c "\dt raw.*"
# 3) Set `name` to the raw Postgres table (same in silver/stg_*.sql source('raw', '...')).
# 4) With abctl public API, Dagster asset key is (ASCII only, no spaces/arrows):
#    airbyte / BlinkAI_API_to_warehouse / sync  (use AIRBYTE_CONNECTION_SLUG in .env)
#    Optional: AIRBYTE_CONNECTION_SLUG in .env overrides auto-slug from CONNECTION_NAME.
#
sources:
  - name: raw
    description: Bronze tables created by Airbyte
    schema: raw
    tables:
      - name: test
        description: Must match \dt raw.* on the warehouse
        meta:
          dagster:
            asset_key:
              - airbyte
              - BlinkAI_API_to_warehouse
              - sync
