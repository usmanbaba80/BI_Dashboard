version: 2

# 1) Run Airbyte sync -> tables appear in schema raw
# 2) List them:  psql ... -c "\dt raw.*"
# 3) Set `name` to the raw Postgres table (same in silver/stg_*.sql source('raw', '...')).
# 4) After AIRBYTE_ENABLED=true, open Dagster -> Assets and copy the Airbyte asset key path
#    for your stream into meta.dagster.asset_key below (3 segments: prefix / connection / stream).
#
sources:
  - name: raw
    description: Bronze tables created by Airbyte
    schema: raw
    tables:
      - name: test
        description: Must match \dt raw.* on the warehouse
        meta:
          dagster:
            asset_key:
              - airbyte
              - YOUR_AIRBYTE_CONNECTION_NAME
              - test
