---
# Authelia configuration for protecting Dagster (and optionally other UIs)
# behind a real login page via nginx forward-auth.
#
# Docs: https://www.authelia.com/configuration/prologue/introduction/
# Secrets (session.secret, storage.encryption_key, identity_validation jwt_secret)
# are injected via environment variables in docker-compose (see AUTHELIA_* env).

theme: light

server:
  address: 'tcp://0.0.0.0:9091'

log:
  level: info

totp:
  issuer: invicttusx.com

# File-based users (no external IdP needed). Passwords are argon2 hashes.
authentication_backend:
  file:
    path: /config/users_database.yml
    password:
      algorithm: argon2

access_control:
  default_policy: deny
  rules:
    # The Authelia portal itself must always be reachable.
    - domain: 'auth.invicttusx.com'
      policy: bypass
    # Require login for Dagster. Add more domains here (e.g. dbt) as needed.
    - domain: 'dagster.invicttusx.com'
      policy: one_factor

session:
  cookies:
    - name: 'authelia_session'
      domain: 'invicttusx.com'                       # shared across *.invicttusx.com
      authelia_url: 'https://auth.invicttusx.com'
      default_redirection_url: 'https://dagster.invicttusx.com'
      expiration: '1 hour'
      inactivity: '15 minutes'

regulation:
  max_retries: 3
  find_time: '2 minutes'
  ban_time: '5 minutes'

storage:
  local:
    path: /config/db.sqlite3

# Writes password-reset / notification emails to a file (no SMTP needed).
notifier:
  filesystem:
    filename: /config/notification.txt
